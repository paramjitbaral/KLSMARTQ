services:
  - type: web
    name: kl-smartq-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
